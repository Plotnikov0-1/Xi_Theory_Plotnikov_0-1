<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Чертёж деревянных часов · 3 слоя · чёрные √2 · белые π · φ пусто</title>
<!--
  ЧЕРТЁЖ деревянных часов (3 слоя), по описанию автора:
  СЛОЙ 1 (низ): 12 кругов МЕЖДУ числами (полупозиции), касаются соседей (r=R·sin15°).
  СЛОЙ 2 (чёрные): 4 круга на 2,5,8,11 = √2-семья.
  СЛОЙ 3 (белые): 4 круга на 3,6,9,12 = π-семья; наезжают на чёрные пополам (везика).
  На 1,4,7,10 кругов НЕТ = φ-семья = КАНАЛЫ (пусто). ◇ qmt/clock_circles.py
-->
<style>
  :root{--pi:#7FB0E6;--rt2:#C98A5A;--phi:#F2C879;--ring:#a9925f;--ink:#DCE3F0;--mut:#828FA9;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#0A0E1A}
  body{font-family:'Iowan Old Style',Georgia,serif;color:var(--ink)}
  #cv{display:block;width:100vw;height:100vh}
  .cap{position:fixed;left:0;right:0;top:0;padding:13px 18px;pointer-events:none;background:linear-gradient(180deg,rgba(10,14,26,.85),rgba(10,14,26,0))}
  .eyebrow{font-family:'Helvetica Neue',Arial,sans-serif;text-transform:uppercase;letter-spacing:.2em;font-size:10px;font-weight:700;color:var(--mut)}
  h1{font-family:'Helvetica Neue',Arial,sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.03em;font-size:clamp(12px,2.6vw,19px);margin-top:5px;color:var(--phi)}
  .toggle{position:fixed;right:12px;top:56px;display:flex;gap:6px;flex-direction:column}
  button{font-family:'Helvetica Neue',Arial,sans-serif;font-size:11px;letter-spacing:.03em;background:#141C2E;color:var(--ink);border:1px solid #20293D;border-radius:5px;padding:6px 9px;cursor:pointer;text-transform:uppercase}
  button.on{border-color:var(--phi);color:var(--phi)}
  .legend{position:fixed;left:12px;bottom:12px;font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--mut);line-height:1.7;pointer-events:none}
  .sw{display:inline-block;width:13px;height:13px;border-radius:50%;margin-right:6px;vertical-align:middle;border:1px solid #333}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="cap">
  <div class="eyebrow">3 слоя · чёрные {2,5,8,11}=√2 · белые {3,6,9,12}=π · {1,4,7,10}=φ пусто · ◇</div>
  <h1>Чертёж деревянных часов</h1>
</div>
<div class="toggle">
  <button id="bStar" class="on">звезда (лучи)</button>
  <button id="bL1" class="on">слой 1 · 12 кругов</button>
  <button id="bL2" class="on">слой 2 · чёрные √2</button>
  <button id="bL3" class="on">слой 3 · белые π</button>
  <button id="bCh" class="on">φ каналы (пусто)</button>
  <button id="bNum" class="on">числа</button>
</div>
<div class="legend">
  <span class="sw" style="background:#dfe6f0;border-color:#7FB0E6"></span>белые {3,6,9,12} = π (верх)<br>
  <span class="sw" style="background:#10131a;border-color:#C98A5A"></span>чёрные {2,5,8,11} = √2 (середина)<br>
  <span class="sw" style="background:transparent;border-color:#a9925f"></span>12 кругов между числами (низ, касаются)<br>
  <span class="sw" style="background:transparent;border:1px dashed #F2C879"></span>{1,4,7,10} = φ КАНАЛЫ (пусто)
</div>

<script>
(function(){
  var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  var W,H,DPR=Math.min(window.devicePixelRatio||1,2);
  function resize(){W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
  addEventListener('resize',resize);resize();
  var show={star:true,l1:true,l2:true,l3:true,ch:true,num:true};
  function tog(id,k){var b=document.getElementById(id);b.onclick=function(){show[k]=!show[k];b.classList.toggle('on',show[k]);};}
  tog('bStar','star');tog('bL1','l1');tog('bL2','l2');tog('bL3','l3');tog('bCh','ch');tog('bNum','num');

  var BLACK=[2,5,8,11], WHITE=[3,6,9,12], CH=[1,4,7,10];
  function ang(u){return (u*30-90)*Math.PI/180;}      // u в часах (12 наверх)
  function P(u,R,cx,cy){var a=ang(u);return [cx+R*Math.cos(a),cy+R*Math.sin(a)];}

  function circle(x,y,r,fill,stroke,w,dash){ctx.beginPath();ctx.arc(x,y,r,0,7);
    if(dash)ctx.setLineDash(dash);
    if(fill){ctx.fillStyle=fill;ctx.globalAlpha=0.92;ctx.fill();ctx.globalAlpha=1;}
    if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=w;ctx.globalAlpha=0.9;ctx.stroke();ctx.globalAlpha=1;}
    ctx.setLineDash([]);}

  function frame(){
    requestAnimationFrame(frame);
    var cx=W/2,cy=H/2+6,R=Math.min(W,H)*0.34;
    var Rc=R*0.60, r=R*0.16;      // кольцо центров и радиус кругов
    var bg=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*0.7);
    bg.addColorStop(0,'#0e1626');bg.addColorStop(1,'#0A0E1A');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

    // 12-лучевая звезда (низ): внешние точки на числах, внутренние между
    if(show.star){ctx.beginPath();
      for(var u=0;u<=12.0001;u+=0.5){var rr=(Math.round(u)===u)?R*1.02:R*0.66;var p=P(u,rr,cx,cy);
        if(u===0)ctx.moveTo(p[0],p[1]);else ctx.lineTo(p[0],p[1]);}
      ctx.closePath();ctx.strokeStyle='#2a2013';ctx.fillStyle='#15110a';ctx.globalAlpha=0.6;ctx.fill();
      ctx.lineWidth=1.4;ctx.globalAlpha=0.7;ctx.stroke();ctx.globalAlpha=1;}

    // СЛОЙ 1: 12 кругов между числами (полупозиции u=0.5,1.5,...), касаются
    if(show.l1){for(var k=0;k<12;k++){var p=P(k+0.5,Rc,cx,cy);
      circle(p[0],p[1],Rc*Math.sin(Math.PI/12),null,'#a9925f',1.4,null);}}  // r=Rc·sin15°

    // СЛОЙ 2: чёрные на 2,5,8,11
    if(show.l2){BLACK.forEach(function(u){var p=P(u,Rc,cx,cy);circle(p[0],p[1],r,'#10131a','#C98A5A',1.6,null);});}

    // СЛОЙ 3: белые на 3,6,9,12 (верх, наезжают на чёрные)
    if(show.l3){WHITE.forEach(function(u){var p=P(u,Rc,cx,cy);circle(p[0],p[1],r,'#dfe6f0','#7FB0E6',1.6,null);});}

    // φ каналы: 1,4,7,10 — пусто (пунктир)
    if(show.ch){CH.forEach(function(u){var p=P(u,Rc,cx,cy);circle(p[0],p[1],r*0.7,null,'#F2C879',1.4,[4,3]);
      ctx.font='9px ui-monospace,Menlo,monospace';ctx.fillStyle='#F2C879';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('φ',p[0],p[1]);});}

    // центр
    ctx.beginPath();ctx.arc(cx,cy,4,0,7);ctx.fillStyle='#B5613C';ctx.fill();

    // числа
    if(show.num){for(var u=1;u<=12;u++){var p=P(u,R*0.90,cx,cy);
      var col=(WHITE.indexOf(u)>=0)?'#9fb0cc':(BLACK.indexOf(u)>=0)?'#C98A5A':'#F2C879';
      ctx.font='bold 15px ui-monospace,Menlo,monospace';ctx.fillStyle=col;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(u===10?'10':String(u),p[0],p[1]);}}

    ctx.font='10px ui-monospace,Menlo,monospace';ctx.fillStyle='#6f7c95';ctx.textAlign='left';
    ctx.fillText('чёрные=√2{2,5,8,11} · белые=π{3,6,9,12} · φ{1,4,7,10} пусто=каналы · 12 нижних касаются (r=R·sin15°)',14,H-16);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
